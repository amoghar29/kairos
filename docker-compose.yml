x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-kairos}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
  POSTGRES_DB: ${POSTGRES_DB:-kairos}

x-service-env: &service-env
  DBDSN: postgres://${POSTGRES_USER:-kairos}:${POSTGRES_PASSWORD:-kairos}@postgres:5432/${POSTGRES_DB:-kairos}?sslmode=disable
  DB_MAX_CONNS: 10
  DB_MIN_CONNS: 2
  DB_MAX_CONN_LIFETIME: 1h
  DB_MAX_CONN_IDLE_TIME: 30m
  DB_HEALTH_CHECK_PERIOD: 1m
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ""
  REDIS_DB: 0
  REDIS_PROTOCOL: 2
  CONSUMER_CONFIG_PATH: /app/consumer.yaml

services:
  postgres:
    image: postgres:16
    environment: *postgres-env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos} -d ${POSTGRES_DB:-kairos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs to completion on every `up`; goose is a no-op once the schema is current.
  migrate:
    build:
      context: .
      target: migrate
    command:
      - postgres://${POSTGRES_USER:-kairos}:${POSTGRES_PASSWORD:-kairos}@postgres:5432/${POSTGRES_DB:-kairos}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      <<: *service-env
      PORT: 8000
      API_LOG_FILE: "" # empty selects stdout, so `docker compose logs` sees it
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./consumer.yaml:/app/consumer.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Exactly one instance: GetDueJobs has no cross-consumer coordination, so a second
  # would dispatch the same job ids to Redis a second time.
  consumer:
    build:
      context: .
      target: consumer
    environment:
      <<: *service-env
      CONSUMER_LOG_FILE: ""
    volumes:
      - ./consumer.yaml:/app/consumer.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
