                    <div><div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-muted)">subscribed queues</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:3px"><sc-for list="{{ workerQueueTags }}" as="q" hint-placeholder-count="2"><span class="tag tag-accent" style="font-size:10.5px;padding:2px 8px">{{ q }}</span></sc-for></div></div>
                    <div><div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-muted)">in_flight</div><div style="font-size:14px">{{ workerInFlight }}</div></div>
                    <div><div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-muted)">heartbeat · last_seen</div><div style="font-size:14px" title="{{ workerLastSeenAbs }}">{{ workerLastSeenRel }}</div></div>
                    <div><div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-muted)">started_at · uptime</div><div style="font-size:14px" title="{{ workerStartedAbs }}">{{ workerUptime }}</div></div>
                  </div>
                  <div style="margin-top:12px;font-size:11px;color:var(--k-muted);max-width:640px;line-height:1.5">The <span class="k-mono">/workers</span> registry contract only carries live state (queues, in_flight, last_seen, started_at) — no downtime history or log stream. Status and recent activity below are derived client-side from live data and job attempts, not a separate endpoint.</div>
                </div>
                <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
                  <h2 style="font-size:19px;margin:0">Executing now</h2>
                  <span style="font-size:11px;color:var(--k-muted)">{{ workerRunningNote }}</span>
                </div>
                <sc-if value="{{ workerIdle }}" hint-placeholder-val="{{ false }}">
                  <div class="blueprint" style="padding:20px;margin-bottom:22px;color:var(--k-muted);font-size:12.5px">
                    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                    Idle — nothing in flight on this worker.
                  </div>
                </sc-if>
                <sc-if value="{{ workerRunningReady }}" hint-placeholder-val="{{ false }}">
                  <div class="blueprint" style="padding:0;margin-bottom:22px;overflow-x:auto">
                    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                    <table class="k-t">
                      <thead><tr>
                        <th style="width:120px">id</th>
                        <th>job</th>
                        <th>handler</th>
                        <th style="width:110px">queue</th>
                        <th class="k-num" style="width:46px">prio</th>
                        <th class="k-num" style="width:56px">attempt</th>
                        <th class="k-num" style="width:100px">running for</th>
                      </tr></thead>
                      <tbody>
                        <sc-for list="{{ workerRunningRows }}" as="rj" hint-placeholder-count="2">
                          <tr class="k-click" onClick="{{ rj.onOpen }}" title="Open job detail">
                            <td class="k-mono">{{ rj.idShort }}</td>
                            <td style="font-family:var(--font-heading);font-weight:600;font-size:14.5px">{{ rj.name }}</td>
                            <td class="k-mono" style="color:var(--k-text2)">{{ rj.handler }}</td>
                            <td style="color:var(--k-text2)">{{ rj.queue }}</td>
                            <td class="k-num">{{ rj.priority }}</td>
                            <td class="k-num" style="color:var(--k-muted)">{{ rj.attempt_no }}</td>
                            <td class="k-num" style="{{ rj.elapsedStyle }}">{{ rj.elapsed }}</td>
                          </tr>
                        </sc-for>
                      </tbody>
                    </table>
                  </div>
                </sc-if>
                <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
                  <h2 style="font-size:19px;margin:0">Recent job attempts</h2>
                  <span style="font-size:11px;color:var(--k-muted)">{{ workerActivityCount }} · derived from job attempt history, most recent first</span>
                </div>
                <sc-if value="{{ workerActivityEmpty }}" hint-placeholder-val="{{ false }}">
                  <div class="blueprint" style="padding:24px;text-align:center;color:var(--k-muted);font-size:12.5px">
                    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                    No attempts recorded for this worker yet.
                  </div>
                </sc-if>
                <sc-if value="{{ workerActivityReady }}" hint-placeholder-val="{{ false }}">
                  <div class="blueprint" style="padding:0;overflow-x:auto">
                    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                    <div style="max-height:480px;overflow:auto">
                      <table class="k-t">
                        <thead><tr>
                          <th>job</th>
                          <th>queue</th>
                          <th class="k-num" style="width:40px">attempt</th>
                          <th style="width:104px">outcome</th>
                          <th class="k-num" style="width:86px">started</th>
                          <th class="k-num" style="width:78px">duration</th>
                        </tr></thead>
                        <tbody>
                          <sc-for list="{{ workerActivityRows }}" as="a" hint-placeholder-count="8">
                            <tr class="k-click" onClick="{{ a.onOpen }}" title="Open job detail">
                              <td style="font-family:var(--font-heading);font-weight:600;font-size:14px">{{ a.job_name }}</td>
                              <td style="color:var(--k-text2)">{{ a.queue }}</td>
                              <td class="k-num" style="color:var(--k-muted)">{{ a.attempt_no }}</td>
                              <td><span style="{{ a.outcomeStyle }}">{{ a.outcome }}</span></td>
                              <td class="k-num" style="color:var(--k-text2)" title="{{ a.startedAbs }}">{{ a.startedRel }}</td>
                              <td class="k-num">{{ a.duration }}</td>
                            </tr>
                          </sc-for>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ isWorkerList }}" hint-placeholder-val="{{ true }}">
        <div>
        <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:16px">
          <h1 style="font-size:27px;margin:0">Workers</h1>
          <span class="k-mono" style="color:var(--k-muted);font-size:11.5px">GET /workers</span>
        </div>
        <sc-if value="{{ workersLoading }}" hint-placeholder-val="{{ false }}">
          <div class="blueprint" style="padding:34px;text-align:center;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-muted)">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            loading /workers
          </div>
        </sc-if>
        <sc-if value="{{ workersError }}" hint-placeholder-val="{{ false }}">
          <div class="blueprint" style="padding:18px 20px;background:var(--k-crit-bg);border-color:var(--k-crit-border)">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <div style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-crit-fg);margin-bottom:4px">error · {{ workersErrorCode }}</div>
            <div style="font-size:13.5px;color:var(--k-crit-fg2);margin-bottom:10px">{{ workersError }}</div>
            <button class="btn btn-secondary" onClick="{{ onRetry }}">Retry</button>
          </div>
        </sc-if>
        <sc-if value="{{ workersEmpty }}" hint-placeholder-val="{{ false }}">
          <div class="blueprint" style="padding:36px;text-align:center">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <div style="font-size:17px;font-family:var(--font-heading);font-weight:600">No workers registered</div>
            <div style="font-size:12.5px;color:var(--k-muted);margin-top:6px">The registry self-expires, so an idle fleet shows nothing here.</div>
          </div>
        </sc-if>
        <sc-if value="{{ workersReady }}" hint-placeholder-val="{{ false }}">
          <div class="blueprint" style="padding:0;overflow-x:auto">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <table class="k-t">
              <thead><tr>
                <th style="width:150px">name</th>
                <th style="width:110px">id</th>
                <th>queues</th>
                <th style="min-width:230px">executing now</th>
                <th class="k-num" style="width:90px">in_flight</th>
                <th class="k-num" style="width:120px">last_seen</th>
                <th class="k-num" style="width:120px">uptime</th>
              </tr></thead>
              <tbody>
                <sc-for list="{{ workerRows }}" as="w" hint-placeholder-count="6">
                  <tr class="k-click" onClick="{{ w.onOpen }}" title="Open worker detail">
                    <td style="font-family:var(--font-heading);font-weight:600;font-size:14.5px">{{ w.name }}</td>
                    <td class="k-mono" style="font-size:12px;color:var(--k-text2)">{{ w.id }}</td>
                    <td>
                      <div style="display:flex;gap:5px;flex-wrap:wrap">
                        <sc-for list="{{ w.queues }}" as="q" hint-placeholder-count="2">
                          <span class="tag tag-accent" style="font-size:10.5px;padding:2px 8px">{{ q }}</span>
                        </sc-for>
                      </div>
                    </td>
                    <td>
                      <sc-if value="{{ w.idle }}" hint-placeholder-val="{{ false }}">
                        <span style="font-size:12px;color:var(--k-faint2)">idle</span>
                      </sc-if>
                      <sc-if value="{{ w.busy }}" hint-placeholder-val="{{ true }}">
                        <button class="btn btn-ghost" onClick="{{ w.onToggleRunning }}" aria-expanded="{{ w.expanded }}" style="display:flex;align-items:center;gap:7px;padding:2px 8px 2px 6px;min-height:24px;font-size:12.5px">
                          <span style="width:9px;display:inline-block;color:var(--k-muted)">{{ w.expandArrow }}</span>
                          <span style="font-family:var(--font-heading);font-weight:600">{{ w.runningLabel }}</span>
                          <span style="font-size:11px;color:var(--k-text2)">{{ w.oldestLabel }}</span>
                        </button>
                      </sc-if>
                    </td>
                    <td class="k-num">{{ w.in_flight }}</td>
                    <td class="k-num" style="color:var(--k-text2)" title="{{ w.lastSeenAbs }}">{{ w.lastSeenRel }}</td>
                    <td class="k-num" style="color:var(--k-text2)" title="{{ w.startedAbs }}">{{ w.uptime }}</td>
                  </tr>
                  <sc-if value="{{ w.expanded }}" hint-placeholder-val="{{ false }}">
                    <tr>
                      <td colspan="7" style="background:var(--color-surface);padding:8px 14px 12px 14px">
                        <div style="font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--k-muted);margin-bottom:6px">in flight on {{ w.name }} — click a job to open it</div>
                        <table class="k-t" style="background:transparent">
                          <thead><tr>
                            <th style="width:118px">id</th>
                            <th>job</th>
                            <th>handler</th>
                            <th style="width:104px">queue</th>
                            <th class="k-num" style="width:46px">prio</th>
                            <th class="k-num" style="width:56px">attempt</th>
                            <th class="k-num" style="width:96px">running for</th>
                          </tr></thead>
                          <tbody>
                            <sc-for list="{{ w.running }}" as="rj" hint-placeholder-count="2">
                              <tr class="k-click" onClick="{{ rj.onOpen }}" title="Open job detail">
                                <td class="k-mono">{{ rj.idShort }}</td>
                                <td style="font-family:var(--font-heading);font-weight:600;font-size:14px">{{ rj.name }}</td>
                                <td class="k-mono" style="color:var(--k-text2)">{{ rj.handler }}</td>
                                <td style="color:var(--k-text2)">{{ rj.queue }}</td>
                                <td class="k-num">{{ rj.priority }}</td>
                                <td class="k-num" style="color:var(--k-muted)">{{ rj.attempt_no }}</td>
                                <td class="k-num" style="{{ rj.elapsedStyle }}">{{ rj.elapsed }}</td>
                              </tr>
                            </sc-for>
                          </tbody>
                        </table>
                      </td>
                    </tr>
                  </sc-if>
                </sc-for>
              </tbody>
            </table>
          </div>
        </sc-if>
        </div>
        </sc-if>
      </div>
    </sc-if>

    <!-- ══ SUBMIT ══ -->
    <sc-if value="{{ isSubmit }}" hint-placeholder-val="{{ false }}">
      <div>
        <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:16px">
          <h1 style="font-size:27px;margin:0">Submit job</h1>
          <span class="k-mono" style="color:var(--k-muted);font-size:11.5px">POST /jobs</span>
        </div>
        <div style="display:grid;grid-template-columns:minmax(320px,440px) minmax(280px,1fr);gap:30px;align-items:start;max-width:1080px">
          <div class="blueprint" style="padding:16px 18px">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <div style="display:flex;flex-direction:column;gap:13px">
              <div class="field"><label>name</label><input class="input" value="{{ form.name }}" onChange="{{ onFormName }}" placeholder="send_email"></div>
              <div class="field"><label>queue</label>
                <select class="input" value="{{ form.queue }}" onChange="{{ onFormQueue }}">
                  <sc-for list="{{ formQueueOptions }}" as="q" hint-placeholder-count="4"><option value="{{ q }}">{{ q }}</option></sc-for>
                </select>
              </div>
              <div class="field"><label>handler — required, must not be empty</label>
                <input class="input k-mono" style="font-size:12.5px" value="{{ form.handler }}" onChange="{{ onFormHandler }}" placeholder="email.send" list="kairos-handlers">
                <datalist id="kairos-handlers">
                  <sc-for list="{{ formHandlerOptions }}" as="h" hint-placeholder-count="4"><option value="{{ h }}"></option></sc-for>
                </datalist>
              </div>
              <div class="field"><label>priority — 1 is highest, 10 lowest (default 5)</label>
                <input class="input" type="number" min="1" max="10" value="{{ form.priority }}" onChange="{{ onFormPriority }}">
              </div>
              <div class="field"><label>schedule</label>
                <div style="display:flex;gap:6px;margin-top:2px">
                  <sc-for list="{{ modeChips }}" as="chip" hint-placeholder-count="2">
                    <button onClick="{{ chip.onPick }}" aria-pressed="{{ chip.pressed }}" style="{{ chip.style }}">{{ chip.label }}</button>
                  </sc-for>
                </div>
              </div>
              <sc-if value="{{ formIsCron }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-direction:column;gap:13px">
                  <div class="field"><label>cron expression · 5 fields, UTC</label>
                    <select class="input" style="margin-bottom:6px" value="{{ form.cronPreset }}" onChange="{{ onFormCronPreset }}">
                      <sc-for list="{{ cronPresetOptions }}" as="p" hint-placeholder-count="6"><option value="{{ p.value }}">{{ p.label }}</option></sc-for>
                    </select>
                    <input class="input k-mono" style="font-size:12.5px" value="{{ form.cron }}" onChange="{{ onFormCron }}" placeholder="*/5 * * * *">
                    <sc-if value="{{ cronError }}" hint-placeholder-val="{{ false }}">
                      <div style="font-size:11.5px;color:var(--k-crit-fg);margin-top:5px">{{ cronError }}</div>
                    </sc-if>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{ formHasWindow }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;gap:12px;flex-wrap:wrap">
                  <div class="field" style="flex:1;min-width:170px"><label>starts_at · UTC · required</label>
                    <input class="input k-mono" style="font-size:12.5px" type="datetime-local" value="{{ form.startsAt }}" onChange="{{ onFormStarts }}">
                  </div>
                  <div class="field" style="flex:1;min-width:170px"><label>ends_at · UTC, optional</label>
                    <input class="input k-mono" style="font-size:12.5px" type="datetime-local" value="{{ form.endsAt }}" onChange="{{ onFormEnds }}">
                  </div>
                </div>
              </sc-if>
              <div class="field"><label>payload · JSON</label>
                <textarea class="input k-mono" style="min-height:150px;font-size:12.5px" value="{{ form.payload }}" onChange="{{ onFormPayload }}"></textarea>
                <sc-if value="{{ payloadError }}" hint-placeholder-val="{{ false }}">
                  <div style="font-size:11.5px;color:var(--k-crit-fg);margin-top:5px">{{ payloadError }}</div>
                </sc-if>
              </div>
              <div class="field"><label>Idempotency-Key · optional header</label>
                <input class="input k-mono" style="font-size:12.5px" value="{{ form.idem }}" onChange="{{ onFormIdem }}" placeholder="leave blank to omit the header">
              </div>
              <div style="display:flex;align-items:center;gap:12px">
                <button class="btn btn-primary" onClick="{{ onSubmit }}" disabled="{{ submitting }}">{{ submitLabel }}</button>
                <button class="btn btn-ghost" onClick="{{ onFormatPayload }}">format JSON</button>
              </div>
              <sc-if value="{{ submitError }}" hint-placeholder-val="{{ false }}">
                <div style="background:var(--k-crit-bg);border:1px solid var(--k-crit-border);padding:9px 11px">
                  <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-crit-fg)">{{ submitErrorCode }}</div>
                  <div style="font-size:12.5px;color:var(--k-crit-fg2)">{{ submitError }}</div>
                </div>
              </sc-if>
              <sc-if value="{{ createdId }}" hint-placeholder-val="{{ false }}">
                <div style="background:var(--k-ok-bg);border:1px solid var(--k-ok-border);padding:10px 12px">
                  <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-ok-fg)">201 created · state pending</div>
                  <a href="{{ createdHref }}" class="k-mono" style="font-size:12.5px">{{ createdId }} →</a>
                </div>
              </sc-if>
            </div>
          </div>
          <div class="blueprint" style="padding:14px 16px">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <div style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-muted);margin-bottom:8px">request preview</div>
            <pre class="k-mono" style="margin:0;background:var(--color-surface);border:1px solid var(--color-divider);padding:11px;overflow:auto;font-size:12px;line-height:1.55">{{ requestPreview }}</pre>
            <sc-if value="{{ formIsCron }}" hint-placeholder-val="{{ false }}">
              <div style="margin-top:14px">
                <div style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-muted);margin-bottom:6px">first runs</div>
                <sc-if value="{{ previewEmpty }}" hint-placeholder-val="{{ false }}">
                  <div style="font-size:12px;color:var(--k-crit-fg)">This expression never fires inside the window — the API rejects it with 422.</div>
                </sc-if>
                <div style="display:flex;flex-direction:column;gap:4px">
                  <sc-for list="{{ cronPreviewRows }}" as="p" hint-placeholder-count="3">
                    <div class="k-mono" style="font-size:12px;display:flex;gap:10px">
                      <span>{{ p.abs }}</span>
                      <span style="color:var(--k-muted)">in {{ p.rel }}</span>
                    </div>
                  </sc-for>
                </div>
                <div style="font-size:11px;color:var(--k-muted);margin-top:8px;line-height:1.5">Missed slots are never backfilled: after downtime the schedule fires once, at the next slot. Runs cannot overlap — a slow occurrence skips the slots it covers.</div>
              </div>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-if>

    <div style="margin-top:34px;padding-top:12px;border-top:1px solid var(--color-divider);display:flex;gap:20px;flex-wrap:wrap;font-size:10.5px;color:var(--k-faint2);letter-spacing:.04em">
      <span>keys: <b style="color:var(--k-text2)">g o</b> overview · <b style="color:var(--k-text2)">g q</b> queues · <b style="color:var(--k-text2)">g j</b> jobs · <b style="color:var(--k-text2)">g c</b> schedules · <b style="color:var(--k-text2)">g d</b> docs · <b style="color:var(--k-text2)">g h</b> handlers · <b style="color:var(--k-text2)">g w</b> workers · <b style="color:var(--k-text2)">g s</b> submit · <b style="color:var(--k-text2)">j / k</b> page · <b style="color:var(--k-text2)">r</b> refresh</span>
      <span style="margin-left:auto">poll 3s · shared interval · paused when tab hidden</span>
    </div>
  </div>
  </div>
</div>
</template>
<script src="/runtime.js"></script>
<script src="/app.js"></script>
<script>__bootDashboard({ rowsPerPage: 25, pollSeconds: 3, simulate: "normal", conflictOnWrite: false });</script>
</body>
